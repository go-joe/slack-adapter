version: "2"
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - lll
    - makezero
    - misspell
    - revive
    - staticcheck
  settings:
    gocritic:
      disabled-checks:
        - unnamedResult
        - hugeParam
      enabled-tags:
        - performance
        - style
        - experimental
        - diagnostic
        - opinionated
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
          - staticcheck
        text: should have a package comment, unless it's in another file for this package
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
