name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25"

    - name: Run unit tests
      run: go test -race -coverprofile=coverage.txt -covermode=atomic -v ./...

    - name: Upload coverage to Codecov
      run: bash <(curl -s https://codecov.io/bash)
